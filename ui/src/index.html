<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>argmind</title>
<!--
  The shell. The token is stamped into `data-token` by the server rather than fetched, because a
  page that has to ask for its own credential has a moment where it does not have one — and because
  a token in a URL ends up in history and in logs.
-->
<style>
  :root {
    --ink: #1c1b19; --dim: #6b6862; --edge: #d9d5cd; --paper: #faf9f6;
    --them: #1c1b19; --say: #2c4a6e; --note: #6b6862; --warn: #8a4b2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 14px/1.55 "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    color: var(--ink); background: var(--paper);
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid var(--edge);
    display: flex; gap: 12px; align-items: baseline;
  }
  #attending { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  #status { color: var(--dim); font-size: 12px; white-space: nowrap; }
  body.busy #status::after { content: " · 생각 중"; color: var(--warn); }

  .middle { flex: 1; display: flex; min-height: 0; }
  /* The conversation column, with the orb behind it. `position: relative` on the stage and
     `absolute` on the canvas is what keeps the sphere still while the transcript scrolls over
     it — a canvas inside the scroller would slide away with the text. */
  .stage { position: relative; flex: 1; min-height: 0; display: flex; }
  #orb { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #transcript { position: relative; flex: 1; overflow-y: auto; padding: 12px 14px; }
  /* Folded away, and it used to be a column beside the conversation. **The reasoning for that
     was right about when you want it and wrong about what it costs**: you check what the model
     saw at the moment an answer is wrong, so it should not need scrolling for — but it was
     taking a third of a window that is 520 px wide, all of the time, for the one turn in twenty
     when somebody looks. Folded, it costs a line and one click. The owner asked, 2026-09-17. */
  #seeing { border-bottom: 1px solid var(--edge); font-size: 13px; background: #fdfcfa; }
  #seen { max-height: 40vh; overflow: auto; margin: 0; padding: 4px 14px 10px; font-size: 11px;
          line-height: 1.5; font-family: Consolas, ui-monospace, monospace;
          white-space: pre; color: var(--ink); }
  #spent { padding: 4px 14px; font-size: 11px; color: var(--dim);
           border-bottom: 1px solid var(--edge); min-height: 21px; }
  .line { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; }
  .line.them { color: var(--them); }
  .line.them::before { content: "› "; color: var(--dim); }
  .line.say { color: var(--say); }
  .line.note { color: var(--note); font-size: 13px; }
  /* What set an unprompted thought off, marked so it is not mistaken for something you said. */
  .line.noticed { color: var(--warn); font-size: 13px; }
  .line.noticed::before { content: "◦ "; }

  #notice { font-size: 12px; padding: 2px 10px; }
  #notice.on { border-color: var(--warn); background: #fdf3ea; }

  #setup { border-bottom: 1px solid var(--edge); padding: 10px 14px; background: #fdfcfa; }
  .setup-head { display: flex; gap: 8px; align-items: baseline; font-weight: 600;
                margin-bottom: 8px; }
  .setup-head .again { margin-left: auto; font-size: 12px; padding: 2px 8px; }
  .need { border-left: 2px solid var(--edge); padding: 4px 0 6px 10px; margin-bottom: 8px; }
  .need.required { border-left-color: var(--warn); }
  .need-what { font-weight: 600; }
  .need-found { color: var(--dim); font-size: 13px; }
  .need-how { color: var(--dim); font-size: 13px; margin-top: 4px; }
  /* The plan keeps the line breaks the server wrote: it is the sentence being agreed to, and
     reflowing it into a paragraph is how a list of consequences becomes a blur. */
  .need-plan { white-space: pre-wrap; font-size: 13px; margin: 6px 0; }
  /* Said in the plan as well; drawn again here because it is the sentence somebody would want to
     have read afterwards, and a bullet in a list of six is not that. */
  .need-stranger { color: var(--warn); font-weight: 600; font-size: 13px; margin: 6px 0; }

  /* The question, and the settings under it. */
  #asking:not([hidden]) { border-bottom: 1px solid var(--edge); padding: 10px 14px;
                          background: #fdfcfa; }
  .ask-what { font-weight: 600; margin-bottom: 4px; }
  .ask-plan { white-space: pre-wrap; font-size: 13px; margin: 6px 0; }
  /* Four buttons, and the two that are remembered are drawn apart from the two that are not —
     pressing 항상 by accident is the mistake this layout exists to make harder. */
  .ask-buttons { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .ask-buttons .always { margin-left: 14px; }
  .ask-buttons .no { margin-left: auto; }
  #settings { border-bottom: 1px solid var(--edge); font-size: 13px; }
  #settings > summary, #seeing > summary { padding: 6px 14px; cursor: pointer;
                                           color: var(--dim); }
  #decisions { padding: 0 14px 10px; }
  .decision { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .decision .standing { color: var(--dim); }
  .decision .standing.allowed { color: var(--say); }
  .decision .standing.denied { color: var(--warn); }
  .decision button { margin-left: auto; font-size: 12px; padding: 1px 8px; }

  #pending:not(:empty) { border-top: 1px solid var(--edge); padding: 8px 14px; }
  .proposal { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .what { flex: 1; }
  /* A second opinion, not a gate: it is dimmer than the label and it disables nothing. */
  .hint { color: var(--warn); font-size: 12px; }
  button {
    font: inherit; padding: 4px 12px; border: 1px solid var(--edge);
    background: #fff; border-radius: 3px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  .yes { border-color: #9fb8a0; }
  .no { border-color: var(--edge); }

  #form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--edge); }
  #said { flex: 1; font: inherit; padding: 6px 10px; border: 1px solid var(--edge);
          border-radius: 3px; background: #fff; color: inherit; }
  /* Held and listening are two states: the first is the key being down, the second is the server
     confirming the device is open. They differ when a microphone fails to start. */
  #talk.holding { border-color: var(--warn); }
  #talk.listening { background: #fdf3ea; }
</style>

<body data-token="__TOKEN__">
  <header>
    <span id="attending">…</span>
    <button type="button" id="notice">지켜보기</button>
    <span id="status"></span>
  </header>
  <div id="spent"></div>
  <!-- Above the transcript, because something missing is the reason nothing works, and a person
       should not have to scroll past a conversation to find out. -->
  <div id="setup" hidden></div>
  <!-- A question with four answers. Above the conversation for the same reason the setup panel
       is: a person should not have to scroll past a transcript to find out why nothing works. -->
  <div id="asking" hidden></div>
  <!-- What has been answered once and for all, and how to take it back. Folded away, because it
       is the panel you want on the day you want it and never otherwise. -->
  <details id="settings">
    <summary>설정 — 기억한 권한</summary>
    <div id="decisions"></div>
  </details>
  <!-- What the model was shown, folded away beside the settings for the same reason: it is the
       panel you want on the day you want it. It used to be a column taking a third of the width
       whether anybody looked or not. Still hidden entirely until there is something in it — a
       fold that opens onto nothing is worse than no fold. -->
  <details id="seeing" hidden>
    <summary>모델이 본 것</summary>
    <pre id="seen"></pre>
  </details>
  <div class="middle">
    <div class="stage">
      <!-- Drawn behind the conversation and never in front of it: it carries no information the
           page does not also say in words, so it must never be the thing in the way of them. -->
      <canvas id="orb" aria-hidden="true"></canvas>
      <div id="transcript"></div>
    </div>
  </div>
  <div id="pending"></div>
  <form id="form" autocomplete="off">
    <input id="said" placeholder="말해보세요" autofocus>
    <button type="submit">보내기</button>
    <!-- Hidden until the server says it has a microphone: a button that cannot work is worse
         than no button. `type=button` so holding it never submits the form. -->
    <button type="button" id="talk" hidden title="누르고 있는 동안 듣습니다 (스페이스)">🎤</button>
  </form>
  <script type="module" src="/app.js"></script>
</body>
