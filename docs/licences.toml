# Every third-party dependency this project declares, and the licence it declares for itself.
#
# `native/argmind-rules/tests/licences.rs` walks every `Cargo.toml` under `native/` and requires
# each name here with a licence from `allowed`. **Adding a dependency therefore fails the suite until a line is added here**, which is
# the point: the owner's rule is that only things with no open-source licence problem are used, and
# a rule nothing enforces is one nobody keeps.
#
# The Rust test also checks the other direction — that nothing under `[rust]` has stopped being a
# dependency — because a record that keeps listing what was removed reads as thorough while being
# wrong, which is how the old `NOTICE` came to attribute three libraries this project had deleted.
#
# Licences are recorded as the projects declare them. This is a record, not legal advice.

# Permissive, no copyleft, no field-of-use restriction, no proprietary redistribution.
allowed = [
    "MIT",
    "MIT-CMU",
    "MIT OR Apache-2.0",
    # **The same pair, written the other way round.** This list is compared literally and that is
    # deliberate — a parser that understood SPDX expressions would be a thing to trust, and the
    # rule is cheaper to keep when the record says exactly what the project said. `wry` writes it
    # in this order.
    "Apache-2.0 OR MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unlicense OR MIT",
]

# **Refused on sight, with the reason**, so a future reader does not have to re-derive it.
[refused]
"GPL-2.0" = "copyleft — would reach this project's own source"
"GPL-3.0" = "copyleft — would reach this project's own source"
"AGPL-3.0" = "copyleft, and over a network boundary too"
"LGPL-3.0" = "relinking obligation; workable but not worth it for anything here"
"NVIDIA CUDA EULA" = """
    Not an open-source licence. cuBLAS and cuDNN may not simply be redistributed, so a GPU build
    that has to ship them is out — measured against, rather than assumed: the CPU path is 16.3 s
    for a two-second clip and unusable, so the acceleration has to come from somewhere that
    redistributes nothing proprietary. Vulkan is that somewhere."""
"CC-BY-NC-*" = "non-commercial — a field-of-use restriction, so not open source"

# **The Python tables were removed on 2026-09-15**, with the Python. `comtypes`, `numpy`,
# `sounddevice`, `torch`, `transformers`, `pillow`, `pytest` and `ruff` are no longer dependencies
# of anything here — the eyes and the voice are `windows-rs`, the microphone is WASAPI, the
# recogniser is a server, and the suite is `cargo test`. They are at
# `python-before-removal-2026-09-15` if the record is ever wanted. A record that keeps naming what
# was removed reads as thorough while being wrong, which is what the old `NOTICE` did.

[rust]
windows = { licence = "MIT OR Apache-2.0", why = "UI Automation and SAPI, natively" }
serde_json = { licence = "MIT OR Apache-2.0", why = "replies, and the expectation files" }
sha2 = { licence = "MIT OR Apache-2.0", why = "the prompt fingerprint, in tests only" }

# **The window, 2026-09-16.** The owner asked for a standalone application rather than a browser
# tab, and on three operating systems. These three are the Tauri project's own bindings and they
# take this tree from three direct dependencies to six — the largest single addition it has made,
# and the reasoning is in `native/argmind-window/src/lib.rs`. The short version: hand-writing the
# Windows half would mean **redistributing `WebView2Loader.dll`**, which this project does not do
# for anything, or calling `CreateWebViewEnvironmentWithOptionsInternal`, which is undocumented and
# is the only other thing the runtime exports — checked with `objdump -p` against runtime
# 153.0.4234.32. And neither is a window on macOS or Linux.
#
# **81 crates enter the Windows build graph behind them.** Read across the whole graph rather than
# the three: no GPL, no AGPL, no LGPL, no non-commercial. Five are MPL-2.0, which is file-level
# copyleft and reaches only modified copies of those files — nothing here modifies them. **This is
# the one place the `allowed` list is checked by eye rather than by the test**, which says plainly
# that it does not follow transitive dependencies.
#
# **Read again across the whole release graph on 2026-11-17**, for `THIRD-PARTY-NOTICES.txt`, which
# a public release has to carry: 137 crates linked into the two executables, 22 more at build time
# only. Two licences there are not on `allowed`, and neither is a problem — recorded rather than
# added, because `allowed` is compared against direct dependencies and neither is one:
#   * **Unicode-3.0**, 15 crates (icu_*, zerovec, yoke, tinystr…), through url → idna → tao. A
#     permissive, OSI-approved licence whose only condition is the notice, which the file carries.
#   * **Microsoft's WebView2 SDK licence**, for the statically linked loader: BSD-3-Clause in
#     Microsoft's own wording, its NOTICE naming Antlr3 and StringTemplate4 (both BSD-3-Clause).
# None of the Windows release graph's crates is MPL-2.0.
wry ={ licence = "Apache-2.0 OR MIT", why = "the webview: WebView2, WKWebView, WebKitGTK" }
tao = { licence = "Apache-2.0", why = "the window and its event loop, on all three" }
# **The browser pane's controls, 2026-10-20.** Both were already in the graph behind wry, so no
# crate enters the build; what changes is that `argmind-window` names them, for one call —
# `CallDevToolsProtocolMethod`, which carries DevTools commands inside the process so that no
# debugging port is opened that any other program on the machine could reach.
webview2-com = { licence = "MIT", why = "the pane's DevTools channel, without a port" }
windows-core = { licence = "MIT OR Apache-2.0", why = "the string type that channel takes" }
# **The Linux eyes, 2026-09-17.** The accessibility tree is D-Bus and this is the smallest correct
# way to speak it. Measured rather than assumed: `dbus` resolves to **6 crates**, `zbus` to 85 and
# `atspi` to 93. It binds `libdbus-1`, which this tree already requires on Linux because the tray
# speaks StatusNotifierItem over it — so no new system dependency either.
#
# Hand-writing the wire protocol was considered and refused, which is the opposite of the usual
# answer here. It is SASL and then a binary marshaller with alignment and endianness rules, and
# getting it subtly wrong produces a widget tree that is quietly wrong. **This project treats a
# silently wrong answer as worse than a crash**, and the GPU K-quant that read RTF 0.123 while
# generating nonsense is why.
dbus = { licence = "Apache-2.0 OR MIT", why = "AT-SPI2 is D-Bus; the eyes on Linux" }

tray-icon = { licence = "MIT OR Apache-2.0", why = """
    The icon by the clock, the menu bar or the status area. It replaced a hand-written
    `Shell_NotifyIconW` tray, which was deleted rather than left beside it — two implementations of
    one thing is how they come to behave differently.""" }

# **Looked at and refused**, with what was checked. The owner asked on 2026-09-16 whether a better
# Korean voice could be had for free, because the only one this machine has is `Microsoft Heami
# Desktop` — a Windows 7-era concatenative voice, and their word for it was 어색함.
#
# **The first answer given was too narrow and is corrected below.** It looked at the two
# best-known open TTS projects, found both Korean voices non-commercial, and concluded that the
# pattern was general — *the engines are permissive and the voices are not*. That generalisation
# came from two data points and it is false: searching what actually exists turned up
# Apache-2.0 weights covering Korean, in GGUF, with an MIT C++ runtime. The narrower claim
# survives and is still worth knowing: **for Piper and for MMS the voice licence is the binding
# constraint, and it is in the model card rather than in the repository.**
[refused-candidates]
"piper ko_KR-kss-medium" = """
    The engine is MIT and the voice is not. Piper has exactly one Korean voice out of 176, trained
    on the Korean Single Speaker dataset, whose model card names
    creativecommons.org/licenses/by-nc-sa/4.0 — non-commercial, which is already in `refused` above
    as a field-of-use restriction. Checked 2026-09-16 against the published `voices.json` and the
    model card, not from memory."""
"facebook/mms-tts-kor" = """
    CC-BY-NC-4.0, from the model's own card. Same reason."""

# **Looked at and allowed, and not taken for a different reason.**
[considered]
"myshell-ai/MeloTTS-Korean" = { licence = "MIT", why = """
    Licence-clean, and passed over for something better rather than for the licence. It is Python
    and PyTorch, and this tree deleted its Python on 2026-09-15; `qwentts.cpp` below does the same
    job in C++ with no interpreter at all.""" }
"hexgrad/Kokoro-82M" = { licence = "Apache-2.0", why = """
    82M parameters, Apache-2.0, and an ONNX build already published — the cheapest thing here by
    far if it fitted. **It has no Korean.** The published language codes are American and British
    English, Spanish, French, Hindi, Italian, Japanese, Portuguese and Mandarin.""" }
"Windows 11 natural voices" = { licence = "part of Windows", why = """
    **The free one, and the first to try.** Installed from 설정 → 접근성 → 내레이터 → 자연스러운 음성
    추가; neural, local, nothing redistributed and nothing new to link against. Not installed on
    this machine — `Speech_OneCore\\Isolated` is empty and the only Korean token is Heami — so
    whether an ordinary application can use one here is **unverified**: it is a thing to check after
    installing, not a thing to assert. `argmind-env-windows/src/speaker.rs` prefers any Korean
    voice whose name lacks `Desktop`, so a newer one is used the moment one exists.""" }

# **The one that fits was found by looking rather than by recalling.** The owner's rule of
# 2026-09-16 is that a deep-learning framework is allowed if it is C++ or Rust, and that a Python
# one must be rewritten. `qwentts.cpp` needs neither: the runtime is C++17 over GGML — the same
# GGML whisper.cpp already vendors and this project already builds from source — and the weights
# are Apache-2.0 from the Qwen team.
#
# **Its rows are in `[external]` below rather than in a table of their own**, moved there the same
# day `Fix::BuildSpeaker` was written: argmind builds and runs it now, which is what `[external]`
# means and is no longer what "a candidate" means. The record drifting the other way is not
# hypothetical — this file said whisper.cpp was "not yet a dependency" while argmind was compiling
# and running it, and a test now checks for that exact sentence.

# **Faces, 2026-09-23, and the runtime was chosen by a constraint this tree already paid for.**
# `argmind-app.exe` links its WebView2 loader statically because a `-gnu` build exits on a
# double-click with `0xC0000135` and no message, for want of one DLL. ONNX Runtime is a DLL beside
# the executable, so it loses to a pure-Rust reader even though it is the obvious choice and its
# licence is fine.
tract-onnx = { licence = "Apache-2.0 OR MIT", why = """
    Reads ONNX and runs it, in Rust, with no C or C++ toolchain and nothing to ship beside the
    executable. **Measured before it was taken**: it loads YuNet at 640x640 in 0.03 s and runs it in
    103 ms, and SFace in 0.12 s and 45 ms, ten passes each. It does not load every graph — tract
    passes about 85% of the ONNX backend tests and YuNet is refused at every input size but
    640x640 — so this was a spike before it was a dependency.""" }

# Not dependencies: spoken to over a port, or downloaded by the user at run time. Recorded so a
# reader knows they were considered rather than missed.
[external]
ollama = { licence = "MIT", why = "a local server this talks to over HTTP" }
qwen3 = { licence = "Apache-2.0", why = "weights, fetched by Ollama" }
whisper = { licence = "MIT", why = "weights, fetched at first use" }
"whisper.cpp" = { licence = "MIT", why = """
    The recogniser's server. **argmind now clones it at a pinned commit, compiles it with the
    compiler on the machine, and runs the result** — so it is no longer a candidate. Nothing is
    redistributed: the source is fetched from the project's own repository at run time and the
    binary never leaves the machine that built it. ggml, which it vendors, is MIT as well.""" }
ggml = { licence = "MIT", why = """
    Vendored inside whisper.cpp and a submodule of qwentts.cpp; compiled, never redistributed.""" }
"qwentts.cpp" = { licence = "MIT", why = """
    The voice's server. C++17/GGML port of Qwen3-TTS 12 Hz — ten languages **including Korean**,
    24 kHz mono, and a `tts-server` with an OpenAI-compatible HTTP interface, which is the same
    shape argmind already speaks to for Ollama and for whisper.cpp. **argmind clones it at a pinned
    commit, compiles it with the compiler on the machine, and runs the result**, so it is no longer
    a candidate. Nothing is redistributed: the source is fetched from the project's own repository
    at run time and the binary never leaves the machine that built it.""" }
"Qwen3-TTS GGUF" = { licence = "Apache-2.0", why = """
    The weights, from the Qwen team via the qwentts.cpp author's GGUF conversion. **Fetched and
    hash-checked, never executed**, and argmind pins two of them: the 0.6B talker at Q8_0
    (992,615,488 bytes) and the 12 Hz tokenizer at Q4_K_M (254,974,752 bytes). Q8_0 for the talker
    is not a quality preference — `ggml-vulkan`'s K-quant path gives a silently wrong answer there;
    `native/argmind-serve/src/speaker.rs` has the measurement.""" }
# **What the task sandbox has installed** — `argmind-sandbox`, a WSL distro of argmind's own
# (Ubuntu 24.04), where `run` executes. Nothing here is linked into argmind or redistributed; these
# are Ubuntu's own packages, installed there with `apt-get install --no-install-recommends`, and
# the licences are read off each package's `/usr/share/doc/*/copyright` on 2026-11-06.
"python3-docx" = { licence = "MIT", why = """
    Word documents, made and read in the sandbox. Debian records Expat (the MIT text) and one
    BSD-2-Clause file.""" }
"python3-openpyxl" = { licence = "MIT", why = "Excel workbooks, made and read in the sandbox." }
"python3-lxml" = { licence = "BSD-3-Clause", why = """
    Required by both. Its copyright file also names one GPL-2+ file, `test.py` — the upstream
    source tree's test runner, which the binary package does not install.""" }
"python3-et-xmlfile" = { licence = "MIT", why = "Required by openpyxl." }
"python3-typing-extensions" = { licence = "PSF-2.0", why = """
    Required by python-docx. Not in `allowed`, which governs what is linked into argmind; PSF-2.0
    is permissive with no copyleft, and it is the licence of the sandbox's `python3` itself.""" }
"libxml2 and libxslt" = { licence = "MIT", why = "Beneath lxml. Debian records MIT and ISC." }
# **And the one that was taken out.** Installed with its recommends, openpyxl and lxml pulled in
# Pillow, and Pillow pulled in **`libimagequant` 2.18, GPL-3.0-or-later** — refused above. Purged
# with every other recommend (bs4, html5lib, cssselect, olefile…); `import docx, openpyxl` and
# writing both kinds of file work without them, checked after the purge.

# **The face models, and the one that was refused.** The default choice everywhere for this job is
# InsightFace — `buffalo_l`, the ArcFace family. Its *code* is MIT and its **weights are not**:
# almost every published ArcFace-lineage weight file is trained on datasets released for research
# only, and InsightFace sells a commercial licence for exactly that reason. The owner's rule is
# 오픈소스라이센스에 문제 없는것만 사용할것, so it is out, and the pair below is what is left that
# is small, fast and clean. Recorded because "we used the obvious one" is what a future reader will
# otherwise assume.
YuNet = { licence = "MIT", why = """
    Face detection, 232,589 bytes, from OpenCV's model zoo. Gives a box and **five landmarks** —
    eyes, nose, mouth corners — which is what `Face::head_on` reads. Fetched at first use and
    hash-checked, never executed: it is weights for `tract`.""" }
SFace = { licence = "Apache-2.0", why = """
    Face recognition, 38,696,353 bytes, from the same zoo, giving 128 numbers per face. **The
    licence on this one was once unclear** — an OpenCV issue from 2021 says it was not indicated —
    and the model directory now carries an Apache-2.0 LICENSE of its own, which is the resolution
    and is what is recorded. Fetched and hash-checked, never executed.""" }

"Vulkan SDK" = { licence = "MIT OR Apache-2.0", why = """
    **A build tool, not a dependency** — the shader compiler `ggml-vulkan` needs to generate its
    SPIR-V, used at build time and not linked into anything argmind ships. What runs afterwards is
    `vulkan-1.dll`, which comes with the graphics driver. argmind offers to install it with
    `winget install --id KhronosGroup.VulkanSDK`, elevated, and the licence above is the one
    LunarG declares through that package.""" }
