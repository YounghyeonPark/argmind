<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900"
     font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="argmind's neural network inside the full composition. Sensor streams are aligned and mapped into one flat regressor. A Guard wraps a Stack, and the Stack holds the convolutional backbone and the linear head as one Adapter with one flat state block. Inside the backbone: a 72 by 96 by 3 frame goes through a 5 by 5 convolution with 12 channels at stride 4 to 18 by 24 by 12, a 3 by 3 depthwise at stride 2 to 9 by 12 by 12, a pointwise to 16 channels giving 9 by 12 by 16, and a 3 by 3 grid average pool giving 144 features. Those are concatenated with 150 memory values and one constant to make 295, which the head maps to a 9 by 12 output map. The backward path runs from the head's input gradient, is sliced to the first 144 values, and drives the backbone's backward pass and gradient application.">

  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1F5C8B"/></marker>
    <marker id="bwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#B4551F"/></marker>
    <marker id="gry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#6B747C"/></marker>
  </defs>

  <!-- explicit ground: a standalone SVG is composited over whatever the host paints -->
  <rect x="0" y="0" width="1180" height="900" fill="#F7F8FA"/>

  <text x="34" y="42" font-size="20" font-weight="700" fill="#14181C">argmind — the network inside the composition</text>
  <text x="34" y="64" font-size="12.5" fill="#5C666F">Every shape read out of the running code. Blue is data; rust is gradient. 2026-08-17.</text>

  <!-- ============ band 1: the composition ============ -->
  <text x="34" y="106" font-size="11" font-weight="700" letter-spacing="1.4" fill="#5C666F"
        font-family="ui-monospace, Consolas, monospace">1 — THE COMPOSITION</text>

  <rect x="34" y="120" width="140" height="52" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.3"/>
  <text x="104" y="142" font-size="12.5" text-anchor="middle" fill="#14181C">Stream ×N</text>
  <text x="104" y="159" font-size="10.5" text-anchor="middle" fill="#5C666F">rings, monotonic t</text>
  <line x1="174" y1="146" x2="200" y2="146" stroke="#1F5C8B" stroke-width="2" marker-end="url(#fwd)"/>

  <rect x="204" y="120" width="140" height="52" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.3"/>
  <text x="274" y="142" font-size="12.5" text-anchor="middle" fill="#14181C">Aligner</text>
  <text x="274" y="159" font-size="10.5" text-anchor="middle" fill="#5C666F">hold_last, staleness</text>
  <line x1="344" y1="146" x2="370" y2="146" stroke="#1F5C8B" stroke-width="2" marker-end="url(#fwd)"/>

  <rect x="374" y="120" width="150" height="52" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.3"/>
  <text x="449" y="142" font-size="12.5" text-anchor="middle" fill="#14181C">FrameMap</text>
  <text x="449" y="159" font-size="10.5" text-anchor="middle" fill="#5C666F">declared index table</text>
  <line x1="524" y1="146" x2="550" y2="146" stroke="#1F5C8B" stroke-width="2" marker-end="url(#fwd)"/>

  <rect x="554" y="112" width="270" height="68" fill="#EAF0F6" stroke="#1F5C8B" stroke-width="1.6"/>
  <text x="689" y="134" font-size="12.5" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">one flat regressor x</text>
  <text x="689" y="152" font-size="11" text-anchor="middle" fill="#5C666F">20,736 image values · then 151 extras</text>
  <text x="689" y="170" font-size="11" text-anchor="middle" fill="#1F5C8B" font-weight="600">flat by design — FrameMap builds 1-D</text>
  <line x1="824" y1="146" x2="856" y2="146" stroke="#1F5C8B" stroke-width="2" marker-end="url(#fwd)"/>

  <rect x="860" y="112" width="150" height="68" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.3"/>
  <text x="935" y="140" font-size="12.5" text-anchor="middle" fill="#14181C">StepReport</text>
  <text x="935" y="158" font-size="10.5" text-anchor="middle" fill="#5C666F">updated · frozen_by</text>
  <text x="935" y="173" font-size="10.5" text-anchor="middle" fill="#5C666F">staleness · prediction</text>

  <!-- ============ band 2: guard > stack > network ============ -->
  <text x="34" y="228" font-size="11" font-weight="700" letter-spacing="1.4" fill="#5C666F"
        font-family="ui-monospace, Consolas, monospace">2 — THE NETWORK, INSIDE THE GUARD</text>

  <!-- guard -->
  <rect x="34" y="242" width="1112" height="382" fill="none" stroke="#1F5C8B" stroke-width="2.4"/>
  <text x="50" y="266" font-size="13.5" font-weight="700" fill="#1F5C8B"
        font-family="ui-monospace, Consolas, monospace">Guard</text>
  <text x="112" y="266" font-size="11.5" fill="#5C666F">checkpoint ring · rollback · freeze · external bounds — wraps EVERYTHING below</text>

  <!-- stack -->
  <rect x="52" y="282" width="1076" height="324" fill="#FFFFFF" stroke="#B4551F" stroke-width="2"/>
  <text x="68" y="306" font-size="13.5" font-weight="700" fill="#B4551F"
        font-family="ui-monospace, Consolas, monospace">Stack</text>
  <text x="126" y="306" font-size="11.5" fill="#5C666F">is itself an Adapter · one flat state block = [ backbone 1,240 | head 31,860 ]</text>

  <!-- backbone group -->
  <rect x="70" y="322" width="620" height="180" fill="#F2F6FA" stroke="#1F5C8B" stroke-width="1.3"
        stroke-dasharray="5 4"/>
  <text x="84" y="343" font-size="11.5" font-weight="700" fill="#1F5C8B"
        font-family="ui-monospace, Consolas, monospace">Backbone — the convolutional stack</text>

  <!-- frame -->
  <rect x="84" y="356" width="104" height="60" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.2"/>
  <text x="136" y="380" font-size="11.5" text-anchor="middle" fill="#14181C">frame</text>
  <text x="136" y="398" font-size="10.5" text-anchor="middle" fill="#5C666F"
        font-family="ui-monospace, Consolas, monospace">72×96×3</text>
  <line x1="188" y1="386" x2="208" y2="386" stroke="#1F5C8B" stroke-width="1.8" marker-end="url(#fwd)"/>

  <rect x="212" y="356" width="110" height="60" fill="#DCE8F2" stroke="#1F5C8B" stroke-width="1.6"/>
  <text x="267" y="374" font-size="11" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">conv 12@5×5</text>
  <text x="267" y="389" font-size="10.5" text-anchor="middle" fill="#5C666F">stride 4 · relu6</text>
  <text x="267" y="406" font-size="10.5" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">18×24×12 · 912 w</text>
  <line x1="322" y1="386" x2="342" y2="386" stroke="#1F5C8B" stroke-width="1.8" marker-end="url(#fwd)"/>

  <rect x="346" y="356" width="110" height="60" fill="#DCE8F2" stroke="#1F5C8B" stroke-width="1.6"/>
  <text x="401" y="374" font-size="11" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">depthwise 3×3</text>
  <text x="401" y="389" font-size="10.5" text-anchor="middle" fill="#5C666F">stride 2 · no mixing</text>
  <text x="401" y="406" font-size="10.5" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">9×12×12 · 120 w</text>
  <line x1="456" y1="386" x2="476" y2="386" stroke="#1F5C8B" stroke-width="1.8" marker-end="url(#fwd)"/>

  <rect x="480" y="356" width="100" height="60" fill="#DCE8F2" stroke="#1F5C8B" stroke-width="1.6"/>
  <text x="530" y="374" font-size="11" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">pointwise →16</text>
  <text x="530" y="389" font-size="10.5" text-anchor="middle" fill="#5C666F">1×1 · mixes</text>
  <text x="530" y="406" font-size="10.5" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">9×12×16 · 208 w</text>
  <line x1="580" y1="386" x2="598" y2="386" stroke="#1F5C8B" stroke-width="1.8" marker-end="url(#fwd)"/>

  <rect x="602" y="356" width="76" height="60" fill="#FFFFFF" stroke="#1F5C8B" stroke-width="1.2"/>
  <text x="640" y="374" font-size="10.5" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">grid pool</text>
  <text x="640" y="389" font-size="10.5" text-anchor="middle" fill="#5C666F">3×3, not global</text>
  <text x="640" y="406" font-size="11" text-anchor="middle" fill="#1F5C8B" font-weight="600">144</text>

  <text x="84" y="440" font-size="10.5" fill="#5C666F">Solid blue holds weights; outlined is a pure function.
    Global pooling would discard <tspan font-style="italic">where</tspan> — measured 1.076 against 0.231 on a position task.</text>
  <text x="84" y="458" font-size="10.5" fill="#5C666F">Peak activation cost <tspan font-weight="700" fill="#14181C">25,920 values</tspan> — that,
    not the 1,240 weights, is what a target tier must hold.</text>
  <text x="84" y="482" font-size="10.5" fill="#B4551F" font-weight="600">Depth lives INSIDE one layer: chaining two layer objects is refused,
    because backward() returns no gradient w.r.t. its own input.</text>

  <!-- extras bypass -->
  <path d="M 136 502 L 136 540 L 716 540 L 716 400" fill="none" stroke="#6B747C" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#gry)"/>
  <text x="420" y="558" font-size="11" text-anchor="middle" fill="#5C666F">extras bypass the layers — 150 memory values + 1 constant</text>

  <!-- concat + head -->
  <rect x="706" y="356" width="96" height="60" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.2"
        stroke-dasharray="4 3"/>
  <text x="754" y="380" font-size="11" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">concat</text>
  <text x="754" y="398" font-size="11" text-anchor="middle" fill="#1F5C8B" font-weight="600">295</text>
  <line x1="802" y1="386" x2="822" y2="386" stroke="#1F5C8B" stroke-width="2" marker-end="url(#fwd)"/>

  <rect x="826" y="342" width="180" height="88" fill="#DCE8F2" stroke="#1F5C8B" stroke-width="2.6"/>
  <text x="916" y="366" font-size="12.5" text-anchor="middle" fill="#14181C" font-weight="700"
        font-family="ui-monospace, Consolas, monospace">head</text>
  <text x="916" y="384" font-size="11" text-anchor="middle" fill="#5C666F">any Adapter — RLS, NLMS,</text>
  <text x="916" y="399" font-size="11" text-anchor="middle" fill="#5C666F">or a network</text>
  <text x="916" y="418" font-size="11.5" text-anchor="middle" fill="#1F5C8B" font-weight="600"
        font-family="ui-monospace, Consolas, monospace">295 → 108 · 31,860 θ</text>
  <line x1="1016" y1="386" x2="1040" y2="386" stroke="#1F5C8B" stroke-width="2" marker-end="url(#fwd)"/>

  <rect x="1044" y="356" width="70" height="60" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.2"/>
  <text x="1079" y="380" font-size="10.5" text-anchor="middle" fill="#14181C">map out</text>
  <text x="1079" y="398" font-size="10.5" text-anchor="middle" fill="#5C666F"
        font-family="ui-monospace, Consolas, monospace">9×12=108</text>

  <!-- backward path -->
  <path d="M 916 430 L 916 470 L 754 470" fill="none" stroke="#B4551F" stroke-width="2.4"
        marker-end="url(#bwd)"/>
  <text x="836" y="463" font-size="11" text-anchor="middle" fill="#B4551F" font-weight="600"
        font-family="ui-monospace, Consolas, monospace">input_gradient() · 295</text>

  <rect x="640" y="478" width="230" height="44" fill="#F7EDE4" stroke="#B4551F" stroke-width="1.8"/>
  <text x="755" y="496" font-size="11.5" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">slice [:144]</text>
  <text x="755" y="513" font-size="10.5" text-anchor="middle" fill="#5C666F">the extras are not the layers' output</text>
  <path d="M 640 500 L 470 500" fill="none" stroke="#B4551F" stroke-width="2.4" marker-end="url(#bwd)"/>
  <text x="556" y="493" font-size="10.5" text-anchor="middle" fill="#B4551F">d_features · 144</text>

  <rect x="240" y="478" width="226" height="44" fill="#F7EDE4" stroke="#B4551F" stroke-width="1.8"/>
  <text x="353" y="496" font-size="11.5" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">backward() → apply_gradients()</text>
  <text x="353" y="513" font-size="10.5" text-anchor="middle" fill="#5C666F">only when the head's step was applied</text>
  <path d="M 300 478 L 300 424 L 267 424 L 267 418" fill="none" stroke="#B4551F" stroke-width="2.2"
        marker-end="url(#bwd)"/>

  <text x="68" y="586" font-size="11" fill="#B4551F" font-weight="600">One update(x, y) moves both levels. One state block, so a
    checkpoint checkpoints the layers, a rollback rolls them back, a freeze stops them learning,</text>
  <text x="68" y="602" font-size="11" fill="#B4551F" font-weight="600">and one persistence record carries them — none of which was true while the backbone sat outside the Guard.</text>

  <!-- ============ band 3: what this replaces ============ -->
  <text x="34" y="668" font-size="11" font-weight="700" letter-spacing="1.4" fill="#5C666F"
        font-family="ui-monospace, Consolas, monospace">3 — WHAT IT REPLACES, AND WHAT IS STILL OUTSIDE</text>

  <rect x="34" y="682" width="540" height="150" fill="#FFFFFF" stroke="#6B747C" stroke-width="1.2"/>
  <text x="52" y="706" font-size="12" font-weight="700" fill="#14181C">Before — two objects, two state blocks (historical)</text>
  <rect x="52" y="718" width="130" height="40" fill="none" stroke="#6B747C" stroke-width="1.2"/>
  <text x="117" y="743" font-size="11" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">Backbone</text>
  <rect x="212" y="718" width="180" height="40" fill="none" stroke="#6B747C" stroke-width="1.2"
        stroke-dasharray="4 3"/>
  <text x="302" y="737" font-size="10.5" text-anchor="middle" fill="#14181C">demo: 2·θ[:−1] @ resid</text>
  <text x="302" y="751" font-size="10" text-anchor="middle" fill="#5C666F">42 lines · linear heads only</text>
  <rect x="422" y="718" width="130" height="40" fill="none" stroke="#1F5C8B" stroke-width="1.6"/>
  <text x="487" y="737" font-size="11" text-anchor="middle" fill="#14181C"
        font-family="ui-monospace, Consolas, monospace">Guard</text>
  <text x="487" y="751" font-size="10" text-anchor="middle" fill="#5C666F">head only</text>
  <text x="52" y="782" font-size="10.5" fill="#5C666F">A rollback restored the head and left the representation
    wherever the fault pushed it.</text>
  <text x="52" y="799" font-size="10.5" fill="#5C666F">The composite had to know the head was linear, and that its
    constant sat in the last row.</text>
  <text x="52" y="820" font-size="10.5" fill="#B4551F" font-weight="600">Retired 2026-08-17 — the demo runs on Stack for
    --input learned; guard state 870 → 2,110.</text>

  <rect x="600" y="682" width="546" height="150" fill="#FDF7F2" stroke="#B4551F" stroke-width="1.6"/>
  <text x="618" y="706" font-size="12" font-weight="700" fill="#14181C">Deliberately outside the network</text>
  <text x="618" y="728" font-size="10.5" fill="#5C666F"><tspan font-family="ui-monospace, Consolas, monospace"
    fill="#14181C">np.std(frame) → set_external(0)</tspan> — the guard watches the caller's own scalar.</text>
  <text x="618" y="744" font-size="10.5" fill="#5C666F">The head cannot see a covered camera; it fits a flat grey frame
    happily. This is how it is told.</text>
  <text x="618" y="768" font-size="10.5" fill="#5C666F"><tspan font-weight="700" fill="#14181C">1,087 lines of classical
    perception</tspan> in demo/label_sources.py still produce the target map.</text>
  <text x="618" y="784" font-size="10.5" fill="#5C666F">argmind learns none of it. Withdrawing that teacher is the
    experiment the 2026-08-14 decision asks for.</text>
  <text x="618" y="808" font-size="10.5" fill="#5C666F">No audio, no actuator, no speech path. Nothing pretrained
    anywhere — weights are seeded, then learned</text>
  <text x="618" y="824" font-size="10.5" fill="#5C666F">from the input stream alone.</text>

</svg>
