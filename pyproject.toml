[project]
name = "argmind"
version = "0.1.0.dev0"
description = "Argmind CM — runtime API, functional simulator, and Phase 0 performance model"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# Phase 0 needs only these. The RTL flow (Verilator/cocotb) is Phase 2 and is
# blocked on a Linux environment — see TESTING.md.
dependencies = ["numpy>=2.0", "scipy>=1.14", "osqp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]
# The CVXPY front end for the code generator. Optional on purpose: the direct
# front door (QPProblem.from_arrays) needs nothing beyond numpy, the generator
# imports cvxpy lazily, and the test suite skips the front-end tests when it is
# absent. A user's existing CVXPY problem is the adoption on-ramp, not a
# requirement for using the generator.
cvxpy = ["cvxpy>=1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning",
    # Upstream notice that osqp will change its `raise_error` default. We check
    # `res.info.status` explicitly on every solve, so the change is not a hazard
    # for us -- but revisit when pinning a newer osqp.
    "ignore:The default value of raise_error:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py312"

# Apache-2.0 as of 2026-08-07; publishable source carries SPDX headers. The
# patent path was deliberately forgone (PLAN.md 7.1), so the header is an
# intentional grant rather than a placeholder. business/ is NOT published.
[tool.setuptools]
packages = ["argmind", "argmind.codegen", "argmind.solvers"]
