[project]
name = "argmind"
version = "0.1.0.dev0"
description = "Argmind CM — runtime API, functional simulator, and Phase 0 performance model"
requires-python = ">=3.12"

# Phase 0 needs only these. The RTL flow (Verilator/cocotb) is Phase 2 and is
# blocked on a Linux environment — see TESTING.md.
dependencies = ["numpy>=2.0", "scipy>=1.14", "osqp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning",
    # Upstream notice that osqp will change its `raise_error` default. We check
    # `res.info.status` explicitly on every solve, so the change is not a hazard
    # for us -- but revisit when pinning a newer osqp.
    "ignore:The default value of raise_error:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py312"

# The `argmind/` package is the runtime API and functional simulator. It is
# destined for public release as `argmind-sim` under Apache-2.0, so it is written
# to be read by outsiders. It carries NO licence headers yet: publication is on
# hold until the filing question is settled (PLAN.md 7.1), and a licence header
# implies a grant we have not decided to make.
[tool.setuptools]
packages = ["argmind", "argmind.solvers"]
