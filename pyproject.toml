[project]
name = "argmind"
version = "0.0.1.dev0"
description = "On-device online adaptation and inference for sensor systems: guarded adapters, a bounded pipeline, and a versioned record format"
requires-python = ">=3.11"
authors = [{ name = "Younghyeon Park", email = "ypark.dev@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# Deliberately minimal. This targets embedded and edge devices, so every
# dependency is a portability cost. numpy is the one concession -- it is the
# lingua franca for sample buffers and is available wherever Python is.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
# accelerator/ is parked and its 429 tests do not gate work on this project.
# Run them explicitly with: python -m pytest accelerator/tests
#
# `demo` used to be listed here, because it had never run under `python -m pytest` since the
# demo landed — present, compiled and reached by nothing, the `select_newest` shape. The demo
# was removed with the rest of the old tree on 2026-09-09 (REBUILD.md step 5) and the entry
# went with it rather than being left pointing at nothing.
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.setuptools]
packages = ["argmind"]
