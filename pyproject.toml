[project]
name = "argmind"
version = "0.0.1.dev0"
description = "Sensor-agnostic on-device online adaptation and inference for embedded targets"
requires-python = ">=3.11"
authors = [{ name = "Younghyeon Park", email = "ypark.dev@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# Deliberately minimal. This targets embedded and edge devices, so every
# dependency is a portability cost. numpy is the one concession -- it is the
# lingua franca for sample buffers and is available wherever Python is.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
# accelerator/ is parked and its 429 tests do not gate work on this project.
# Run them explicitly with: python -m pytest accelerator/tests
#
# `demo` is here because it was not, and `demo/test_pointer.py` had therefore never run
# under `python -m pytest` since the demo landed. Same shape as `select_newest`: present,
# compiled, and reached by nothing. The demo's tests import no OpenCV — `pointer.py` takes
# `import cv2` inside `main()` — so collecting them costs a clone without it nothing.
testpaths = ["tests", "demo"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.setuptools]
packages = ["argmind"]
