const LANGS = ["ko", "en", "zh", "ja"];
function chosen() {
  const asked = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(asked)) return asked;
  try { const kept = localStorage.getItem("argmind-lang"); if (LANGS.includes(kept)) return kept; } catch {}
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const two = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(two)) return two;
  }
  return "en";
}
function write(lang) {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) {
    const row = T[el.dataset.t];
    if (row) el.innerHTML = row[lang] ?? row.en;
  }
  document.getElementById("lang").value = lang;
}
const select = document.getElementById("lang");
select.addEventListener("change", () => {
  write(select.value);
  try { localStorage.setItem("argmind-lang", select.value); } catch {}
});
write(chosen());
</script>

    o.doing("thinking");
    setTimeout(() => o.doing("resting"), 1500);
  } catch {}
</script>
