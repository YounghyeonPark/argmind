# The public page: site/, with the application's own sphere copied in beside it, so the page
# draws exactly what argmind draws. Runs only when site/ or the compiled sphere changes, or by hand.
name: pages

on:
  push:
    branches: [main]
    paths: [site/**, ui/dist/orb.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages needs a public repository on a free plan; while this one is private the job is skipped
    # rather than failing on every push.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp ui/dist/orb.js site/orb.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
