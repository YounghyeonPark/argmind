[package]
name = "argmind-env-windows"
version = "0.0.1"
edition = "2021"
description = "UI Automation for eyes. The deterministic side, natively."
license = "Apache-2.0"

[dependencies]
argmind-core = { path = "../argmind-core" }
# The voice seam: `Heard`, `Listener`, `Speaker`. Types only — it names no platform.
argmind-voice = { path = "../argmind-voice" }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
