[package]
name = "argmind-env-windows"
version = "0.0.1"
edition = "2021"
description = "UI Automation for eyes. The deterministic side, natively."
license = "Apache-2.0"

[dependencies]
argmind-core = { path = "../argmind-core" }
argmind-voice = { path = "../argmind-voice" }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
