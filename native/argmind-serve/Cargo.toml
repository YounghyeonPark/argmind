[package]
name = "argmind-serve"
version = "0.1.0"
edition = "2021"
description = "The seam between the Rust core and a front end that is not Rust."
license = "Apache-2.0"

# No dependencies, deliberately. Raw HTTP/1.1 and server-sent events need none, and the licence
# rule is cheapest to obey when there is nothing new to check.
[dependencies]
argmind-core = { path = "../argmind-core" }
# argmind's own browser pane — platform-free; what carries its commands is handed in by the window.
argmind-env-browser = { path = "../argmind-env-browser" }
# MCP servers the person configured, as a task's tools — std and serde_json only, no platform.
argmind-env-mcp = { path = "../argmind-env-mcp" }

# The binary is the application, so it reaches the environment; the library above it is protocol
# and proposals only, and depends on neither.
argmind-env-ollama = { path = "../argmind-env-ollama" }
argmind-env-whisper = { path = "../argmind-env-whisper" }
argmind-voice = { path = "../argmind-voice" }

# **The environment that can do nothing**, and the only one that builds everywhere. It is what
# `platform.rs` picks when there is no better answer, which on 2026-09-16 is macOS and Linux.
argmind-env-none = { path = "../argmind-env-none" }

# The window the page lives in. **Only `argmind-app` uses it** — the library is protocol and
# proposals and has no opinion about how anybody looks at it. It names no platform either: wry
# picks WebView2, WKWebView or WebKitGTK behind one function.
#
# **Optional so the rest can be compiled for an operating system whose desktop libraries are not
# installed here.** On Linux this pulls `libdbus-sys` and `webkit2gtk-sys`, whose build scripts
# want `pkg-config` and a sysroot; without it `cargo check --target x86_64-unknown-linux-gnu
# --no-default-features` compiles the whole application for Linux on this machine, which is the
# only Linux evidence available until there is a Linux.
argmind-window = { path = "../argmind-window", optional = true }

# Windows only, and by the manifest rather than by a `cfg` inside the code — so a Linux checkout
# does not even try to compile UI Automation.
# Linux only, same reasoning: a Windows checkout has no D-Bus to bind against.
#
# **Optional for the same reason the window is.** It pulls `libdbus-sys`, whose build script wants
# `pkg-config` and a sysroot, so a cross-check from Windows cannot reach it — and that cross-check
# is the thing that keeps the application compiling for Linux at all. Off, everything but the eyes
# is still verified; on, a real Linux build gets them.
[target.'cfg(target_os = "linux")'.dependencies]
argmind-env-linux = { path = "../argmind-env-linux", optional = true }

[target.'cfg(windows)'.dependencies]
argmind-env-windows = { path = "../argmind-env-windows" }
# **Here because of a toolchain, not because of an operating system.** The crate itself has no
# `cfg` in it and would run on all three; `tract-linalg` builds assembly through `cc`, so
# `cargo check --target x86_64-unknown-linux-gnu` cannot reach it from this machine for want of a
# Linux compiler, and that cross-check is the thing keeping the application portable. The gate is
# true for a second reason too — the only camera in this tree is the Windows one — but the first
# reason is the honest one. `argmind-env-face/src/lib.rs` has it.
argmind-env-face = { path = "../argmind-env-face" }
argmind-env-qwentts = { path = "../argmind-env-qwentts" }

[features]
default = ["window", "eyes"]
# The window, and therefore `argmind-app`. On by default; off is for checking the rest of the
# application against a target this machine cannot link.
window = ["dep:argmind-window"]
# The platform's own eyes, where there are any. Same reason for being optional: they need system
# libraries that only exist on the machine they are for.
eyes = ["dep:argmind-env-linux"]
# **Build the application as though this were an operating system nobody has ported to.** Not a
# convenience: it is how a claim about portability is checked on a machine that has one operating
# system. `tests/portable.rs` runs the whole server this way.
headless = []

# Declared rather than discovered, because one of them cannot be built without the window and
# cargo needs telling which.
[[bin]]
name = "argmind-app"
required-features = ["window"]

[[bin]]
name = "serve"

[[bin]]
name = "argmind"

# **Tests only, and the reason is a bug that shipped.** This crate writes its JSON by hand and takes
# no third-party dependency to do it — which is fine right up until a `\"` lands where a line
# continuation was meant and every note the page receives fails to parse. Nothing in the suite could
# notice, because nothing read what those functions produce. A real parser in the tests is the only
# honest way to ask *can a page read this*; `sha2` is here on the same footing.
[dev-dependencies]
serde_json = "1"
