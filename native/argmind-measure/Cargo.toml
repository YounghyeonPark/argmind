[package]
name = "argmind-measure"
version = "0.0.1"
edition = "2021"
description = "What every harness needs before it can measure anything."
license = "Apache-2.0"

[dependencies]
argmind-core = { path = "../argmind-core" }
argmind-env-ollama = { path = "../argmind-env-ollama" }
# The harness layer uses a capability; the capability never uses the harness.
# measure/capture.py imports argmind.env.windows for the same reason, in the same direction.
argmind-env-windows = { path = "../argmind-env-windows" }
serde_json = "1"
sha2 = "0.10"
