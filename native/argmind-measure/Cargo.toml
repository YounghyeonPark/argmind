[package]
name = "argmind-measure"
version = "0.1.0"
edition = "2021"
description = "What every harness needs before it can measure anything."
license = "Apache-2.0"

[dependencies]
argmind-core = { path = "../argmind-core" }
# **The routing rules as the application runs them**, for `--bin routing` — no window, no eyes.
argmind-serve = { path = "../argmind-serve", default-features = false }
argmind-env-ollama = { path = "../argmind-env-ollama" }
# The harness layer uses a capability; the capability never uses the harness.
# measure/capture.py imports argmind.env.windows for the same reason, in the same direction.
argmind-env-windows = { path = "../argmind-env-windows" }
# `voicing` only, and it brings no new third party: the client is raw HTTP/1.1 like the others.
argmind-env-qwentts = { path = "../argmind-env-qwentts" }
# `attending` only: the cheap half of the attention question, pure Rust, no DLL.
argmind-env-face = { path = "../argmind-env-face" }
# `browsing` only: the pane in argmind's own window, driven without a debugging port.
argmind-window = { path = "../argmind-window" }
argmind-env-browser = { path = "../argmind-env-browser" }
argmind-env-mcp = { path = "../argmind-env-mcp" }
# `screen`: the person's foreground window and physical pointer, read before and after.
# `looking`: Windows' own OCR (`Media_Ocr` and what it takes a picture in through) — part of
# Windows, so the same crate with more of its features and no new third party.
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_WinRT",
    "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr",
    "Storage_Streams",
] }
serde_json = "1"
sha2 = "0.10"
