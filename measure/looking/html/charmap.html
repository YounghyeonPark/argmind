<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>문자표</title>
<link rel="stylesheet" href="win.css">
<style>
  .win { position: absolute; left: 330px; top: 70px; width: 620px; height: 660px; background: #f0f0f0;
    border: 1px solid #aaa; box-shadow: 0 8px 30px rgba(0,0,0,.2); font-family: "Malgun Gothic"; font-size: 12px; }
  .win .titlebar { background: #fff; }
  .line { position: absolute; display: flex; align-items: center; gap: 8px; }
  .line label { width: 100px; }
  .combo { width: 330px; height: 24px; padding: 2px 6px; display: flex; align-items: center; border-radius: 2px; }
  button { border-radius: 2px; padding: 2px 10px; height: 24px; background: #e1e1e1; border-color: #adadad; }
  .grid { position: absolute; left: 12px; top: 74px; display: grid; grid-template-columns: repeat(20, 29px);
    border-left: 1px solid #999; border-top: 1px solid #999; background: #fff; }
  .grid span { width: 29px; height: 29px; display: flex; align-items: center; justify-content: center;
    border-right: 1px solid #999; border-bottom: 1px solid #999; font-family: "Segoe UI Symbol", "Malgun Gothic";
    font-size: 16px; }
  .check { position: absolute; left: 12px; top: 392px; display: flex; align-items: center; gap: 6px; }
</style></head>
<body>
<div class="win">
  <div class="titlebar"><span class="title">문자표</span>
    <span class="cap ico" data-name="최소화" data-role="button">&#xE921;</span>
    <span class="cap ico" data-name="최대화" data-role="button">&#xE922;</span>
    <span class="cap ico" data-name="닫기" data-role="button">&#xE8BB;</span></div>
  <div class="line" style="left:12px; top:42px">
    <label>글꼴(F):</label>
    <span class="combo" data-name="글꼴" data-role="combo box">Segoe UI Symbol</span>
    <button data-name="열기" data-role="button" data-target="c-open-font">열기</button>
    <button data-name="도움말" data-role="button">도움말(H)</button>
  </div>
  <div class="grid" data-name="문자 격자" data-role="pane" id="grid"></div>
  <div class="line" style="left:12px; top:360px">
    <label>복사할 문자(A):</label>
    <input data-name="복사할 문자" data-role="edit" style="width:230px; height:24px">
    <button data-name="선택" data-role="button">선택(S)</button>
    <button data-name="복사" data-role="button" data-target="c-copy">복사(C)</button>
  </div>
  <div class="check" data-name="고급 보기" data-role="check box"><input type="checkbox" checked>고급 보기(V)</div>
  <div class="line" style="left:12px; top:428px">
    <label>문자 집합(T):</label>
    <span class="combo" data-name="문자 집합" data-role="combo box">유니코드</span>
    <button data-name="열기" data-role="button" data-target="c-open-charset">열기</button>
  </div>
  <div class="line" style="left:12px; top:466px">
    <label>그룹화(G):</label>
    <span class="combo" data-name="그룹화" data-role="combo box">전체</span>
    <button data-name="열기" data-role="button">열기</button>
  </div>
  <div class="line" style="left:12px; top:504px">
    <label>검색(E):</label>
    <input data-name="검색" data-role="edit" style="width:330px; height:24px">
    <button data-name="찾기" data-role="button">찾기(R)</button>
  </div>
  <div class="line" style="left:12px; top:542px">
    <label>유니코드로 이동(U):</label>
    <input data-name="유니코드로 이동" data-role="edit" style="width:120px; height:24px">
  </div>
  <div class="line" style="left:12px; top:600px; color:#333">U+2190: Leftwards Arrow</div>
</div>
<script>
  // Ten rows of twenty, symbols as Character Map shows them. The grid is ONE item in the list, as
  // the real one is (measure/screens/character-map.json lists "Character Grid" as a single pane).
  const chars = ("←↑→↓↔↕↖↗↘↙⇐⇑⇒⇓⇔∀∂∃∅∇" + "∈∉∋∏∑−∕∙√∝∞∟∠∣∧∨∩∪∫∴" + "∼≅≈≠≡≤≥⊂⊃⊆⊇⊕⊗⊥⋅⌂⌐⌠⌡─" +
    "☀☁☂☃☄☆☇☈☉☊★☋☌☍☎☏☐☑☒☓" + "☚☛☜☝☞☟☠☡☢☣☤☥☦☧☨☩☪☫☬☭" + "☮☯☰☱☲☳☴☵☶☷☸☹☺☻☼☽☾☿♀♁" +
    "♂♃♄♅♆♇♈♉♊♋♌♍♎♏♐♑♒♓♔♕" + "♖♗♘♙♚♛♜♝♞♟♠♡♢♣♤♥♦♧♨♩" + "♪♫♬♭♮♯✁✂✃✄✆✇✈✉✌✍✎✏✐✑").split("");
  const grid = document.getElementById("grid");
  for (const c of chars) {
    const s = document.createElement("span");
    s.textContent = c;
    if (c === "★") s.dataset.target = "c-star";
    grid.appendChild(s);
  }
</script>
</body></html>
