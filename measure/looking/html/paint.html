<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>제목 없음 - 그림판</title>
<link rel="stylesheet" href="win.css">
<style>
  .menu { height: 30px; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: #f9f9f9; }
  .menu span { padding: 4px 10px; }
  .menu .ico { font-size: 14px; padding: 4px 8px; }
  .ribbon { height: 92px; display: flex; align-items: stretch; gap: 0; padding: 6px 8px; background: #f9f9f9;
    border-bottom: 1px solid #e5e5e5; }
  .group { display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 0 14px; border-right: 1px solid #e3e3e3; }
  .group .label { font-size: 11px; color: #666; }
  .tools { display: grid; grid-template-columns: repeat(3, 36px); gap: 4px; }
  .tool { width: 36px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; font-size: 17px; }
  .tool.on { background: #dfe9f6; }
  .swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 5px; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #aaa; }
  .canvasarea { position: absolute; top: 154px; bottom: 26px; left: 0; right: 0; background: #e2e6ec; }
  .canvas { position: absolute; left: 40px; top: 30px; width: 900px; height: 520px; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .status { position: absolute; bottom: 0; left: 0; right: 0; height: 26px; display: flex; align-items: center;
    gap: 24px; padding: 0 12px; font-size: 12px; background: #f9f9f9; border-top: 1px solid #e5e5e5; }
</style></head>
<body>
<div class="titlebar"><span class="title">제목 없음 - 그림판</span>
  <span class="cap ico" data-name="최소화" data-role="button">&#xE921;</span>
  <span class="cap ico" data-name="최대화" data-role="button">&#xE922;</span>
  <span class="cap ico" data-name="닫기" data-role="button">&#xE8BB;</span></div>
<div class="menu">
  <span data-name="파일" data-role="menu item">파일</span><span data-name="편집" data-role="menu item">편집</span>
  <span data-name="보기" data-role="menu item">보기</span>
  <i class="ico" data-name="저장" data-role="button">&#xE74E;</i>
  <i class="ico" data-name="실행 취소" data-role="button">&#xE7A7;</i>
  <i class="ico" data-name="다시 실행" data-role="button">&#xE7A6;</i>
  <span style="flex:1"></span>
  <!-- Two icons with no name: UI Automation would list nothing a model could pick them by. -->
  <i class="ico" data-target="p-trash" style="font-size:16px">&#xE74D;</i>
  <i class="ico" data-target="p-gear" style="font-size:16px">&#xE713;</i>
</div>
<div class="ribbon">
  <div class="group">
    <div class="tools">
      <span class="tool ico on" data-name="연필" data-role="button">&#xE70F;</span>
      <span class="tool ico" data-name="텍스트" data-role="button" data-target="p-text">&#xE8D2;</span>
      <span class="tool ico" data-name="지우개" data-role="button" data-target="p-eraser">&#xE75C;</span>
      <span class="tool ico" data-name="자르기" data-role="button">&#xE7A8;</span>
      <span class="tool ico" data-name="확대/축소" data-role="button">&#xE71E;</span>
      <span class="tool ico" data-name="회전" data-role="button">&#xE7AD;</span>
    </div>
    <span class="label">도구</span>
  </div>
  <div class="group">
    <div class="tools">
      <span class="tool" data-name="직사각형" data-role="button"><svg width="20" height="16"><rect x="2" y="2" width="16" height="12" fill="none" stroke="#333" stroke-width="1.5"/></svg></span>
      <span class="tool" data-name="타원" data-role="button"><svg width="20" height="16"><ellipse cx="10" cy="8" rx="8" ry="6" fill="none" stroke="#333" stroke-width="1.5"/></svg></span>
      <span class="tool" data-name="선" data-role="button"><svg width="20" height="16"><line x1="2" y1="14" x2="18" y2="2" stroke="#333" stroke-width="1.5"/></svg></span>
    </div>
    <span class="label">도형</span>
  </div>
  <div class="group">
    <div class="swatches">
      <span class="sw" style="background:#000" data-name="검정" data-role="button"></span>
      <span class="sw" style="background:#fff" data-name="흰색" data-role="button"></span>
      <span class="sw" style="background:#e81123" data-name="빨강" data-role="button" data-target="p-red"></span>
      <span class="sw" style="background:#ff8c00" data-name="주황" data-role="button"></span>
      <span class="sw" style="background:#fff100" data-name="노랑" data-role="button"></span>
      <span class="sw" style="background:#16c60c" data-name="초록" data-role="button"></span>
      <span class="sw" style="background:#0078d4" data-name="파랑" data-role="button"></span>
      <span class="sw" style="background:#886ce4" data-name="보라" data-role="button"></span>
    </div>
    <span class="label">색</span>
  </div>
</div>
<div class="canvasarea"><div class="canvas" data-name="캔버스" data-role="pane"></div></div>
<div class="status"><span>1280 × 720px</span><span>100%</span></div>
</body></html>
